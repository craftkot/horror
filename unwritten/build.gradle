plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.1.0-alpha'
group = 'dev.unwritten'
base { archivesName = 'the-unwritten' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
sourceSets.main.java.srcDir 'src/game/java'
neoForge {
    version = '26.3.0.118'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { unwritten { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
