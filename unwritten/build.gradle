plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.1.0-alpha'
group = 'dev.unwritten'
base { archivesName = 'the-unwritten' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
sourceSets.main.java.srcDir 'src/game/java'
neoForge {
    version = '26.3.0.118'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { unwritten { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Existing tests are standalone Java main programs, not JUnit.
tasks.named('test') { enabled = false }
['DirectorTest','WorldLogicTest','PersistenceTest','AnomalyLifetimeTest','ReferenceKarmaTest','SleepTest','WatcherPolicyTest','OrePolicyTest','ChasePolicyTest','MinePolicyTest','MimicPolicyTest','NarrativePolicyTest','TimePolicyTest','SocialPolicyTest','SkinLinksTest','HelpCorridorTest','SacrificeLayoutTest'].each { testName ->
    def task = tasks.register("run" + testName, JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'dev.unwritten.' + testName
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    }
    tasks.named('check') { dependsOn task }
}
