plugins { id 'java'; id 'net.minecraftforge.gradle' version '6.0.54' }
version='0.1.0'
group='com.blackfrequency.rift'
base { archivesName='blackfrequency' }
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
minecraft {
 mappings channel: 'official', version: '1.20.1'
 runs {
  client { workingDirectory project.file('run'); mods { blackfrequency { source sourceSets.main } } }
  server { workingDirectory project.file('run'); args '--nogui'; mods { blackfrequency { source sourceSets.main } } }
 }
}
repositories {
 maven {
     name = 'Forge'
     url = 'https://maven.minecraftforge.net'
     content { includeGroupByRegex 'net\\.minecraftforge(\\..*)?' }
 }
 maven {
     name = 'NeoForged'
     url = 'https://maven.neoforged.net/releases'
     content { includeGroupByRegex 'net\\.minecraftforge(\\..*)?' }
 }
 mavenCentral()
}
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.15' }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
