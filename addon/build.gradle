plugins { id 'java'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
version='0.1.0'
group='com.blackfrequency.rift'
base { archivesName='blackfrequency' }
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
minecraft {
 mappings channel: 'official', version: '1.20.1'
 runs {
  client { workingDirectory project.file('run'); mods { blackfrequency { source sourceSets.main } } }
  server { workingDirectory project.file('run'); args '--nogui'; mods { blackfrequency { source sourceSets.main } } }
 }
}
repositories { maven { url='https://maven.minecraftforge.net' }; mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.15' }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
