name: Horror Timer and Restart Audit

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "ci/audit_mod_behaviour.py"
      - ".github/workflows/audit-timer.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download real installed JARs
        run: python ci/download_client_mods.py
      - name: Audit installed JAR bytecode and resources
        run: python ci/audit_mod_behaviour.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timer-audit
          path: timer-audit.json
          if-no-files-found: ignore
