name: EHTID Screen Translator APK
on:
  push:
    branches: [build/ehtid-screen-translator]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EHTIDScreenTranslator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EHTID-ScreenTranslator-debug-apk
          path: EHTIDScreenTranslator/app/build/outputs/apk/debug/*.apk
