name: BLACK FREQUENCY Forge 1.20.1 JAR
on:
  push:
    branches: [feature/black-frequency-forge-1-20-1]
  workflow_dispatch:
jobs:
  forge-jar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Restore exact source bundle and verify SHA256
        shell: bash
        run: |
          mkdir -p black-frequency/project
          cat black-frequency/payload/part_*.b64 | base64 --decode > "$RUNNER_TEMP/black-frequency-source.zip"
          printf '%s  %s\n' 'd5d72e834699c5eed53944b3e8d39d66d72e10dbfe4c73ddd4f49f376fd704fe' "$RUNNER_TEMP/black-frequency-source.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/black-frequency-source.zip" -d black-frequency/project
      - name: Apply Forge 47.4.10 access-modifier compatibility fix
        run: |
          sed -i 's/@Override protected boolean removeWhenFarAway/@Override public boolean removeWhenFarAway/' black-frequency/project/src/main/java/com/blackfrequency/hollowsignal/entity/WatcherEntity.java
          grep 'public boolean removeWhenFarAway' black-frequency/project/src/main/java/com/blackfrequency/hollowsignal/entity/WatcherEntity.java
      - name: Apply BLACK FREQUENCY v0.8 gameplay and admin UI patch
        shell: bash
        run: |
          base64 --decode black-frequency/patch/v0.8.zip.b64 > "$RUNNER_TEMP/bf-v0.8.zip"
          printf '%s  %s\n' '732f5b359bb270ecd05534e9a010aeda496fa2fa8b03446be03d9c3fddd92e3f' "$RUNNER_TEMP/bf-v0.8.zip" | sha256sum --check
          unzip -o -q "$RUNNER_TEMP/bf-v0.8.zip" -d black-frequency/project
      - name: Apply v0.9 cave-contour patch (verified)
        shell: bash
        run: |
          base64 --decode black-frequency/patch/v0.9.zip.b64 > "$RUNNER_TEMP/bf-v0.9.zip"
          printf '%s  %s\n' 'db92347c9832086863c7557c03eeee27138700a96809cb3b14ed79338f08a24f' "$RUNNER_TEMP/bf-v0.9.zip" | sha256sum --check
          unzip -o -q "$RUNNER_TEMP/bf-v0.9.zip" -d black-frequency/project
      - name: Apply cave-independent scenes v0.10
        shell: bash
        run: |
          base64 --decode black-frequency/patch/v0.10.zip.b64 > "$RUNNER_TEMP/bf-v0.10.zip"
          printf '%s  %s\n' 'a2601a5d0d0270f03ca523c69328b5b4896a44bca540fb6915ab56480c1c333e' "$RUNNER_TEMP/bf-v0.10.zip" | sha256sum --check
          unzip -o -q "$RUNNER_TEMP/bf-v0.10.zip" -d black-frequency/project
      - name: Test five cave-free irregular wall geometries and gates
        shell: bash
        working-directory: black-frequency/project
        run: |
          mkdir -p /tmp/bf-cavefree-tests
          javac -d /tmp/bf-cavefree-tests src/main/java/com/blackfrequency/hollowsignal/world/AdaptiveWallGeometry.java scripts/TestCaveFreeGeometry.java
          java -cp /tmp/bf-cavefree-tests TestCaveFreeGeometry
          python3 scripts/verify_cave_independence.py
      - name: Test cave geometry on asymmetric and multi-chamber shapes
        shell: bash
        working-directory: black-frequency/project
        run: |
          mkdir -p /tmp/bf-geometry-tests
          javac -d /tmp/bf-geometry-tests src/main/java/com/blackfrequency/hollowsignal/world/AdaptiveWallGeometry.java scripts/TestAdaptiveWallGeometry.java
          java -cp /tmp/bf-geometry-tests TestAdaptiveWallGeometry
      - name: Apply private reality and psychic overhaul v0.11
        shell: bash
        run: |
          base64 --decode black-frequency/patch/v0.11.zip.b64 > "$RUNNER_TEMP/bf-v0.11.zip"
          printf '%s  %s\n' 'c5ff914b7781edf3a34a216c8e2f0d6cf20714d52057bff5f4aefd0bf82e92ab' "$RUNNER_TEMP/bf-v0.11.zip" | sha256sum --check
          unzip -o -q "$RUNNER_TEMP/bf-v0.11.zip" -d black-frequency/project
      - name: Check private hallucination safety and cleanup
        working-directory: black-frequency/project
        run: python3 scripts/verify_reality_v11.py
      - name: Apply BLACK FREQUENCY v0.12 screen horror update
        shell: bash
        run: |
          base64 --decode black-frequency/patch/v0.12.zip.b64 > "$RUNNER_TEMP/bf-v0.12.zip"
          printf '%s  %s\n' 'e47a62ae648663dd0c3ed08af4c6bc393d9ef317a08d4ce6d5e36ecb0f16ac21' "$RUNNER_TEMP/bf-v0.12.zip" | sha256sum --check
          unzip -o -q "$RUNNER_TEMP/bf-v0.12.zip" -d black-frequency/project
      - name: Verify fake-game-screen safety and cleanup
        working-directory: black-frequency/project
        run: python3 scripts/verify_screen_scares_v12.py
      - name: Apply Russian admin console v0.13
        shell: bash
        run: |
          base64 --decode black-frequency/patch/v0.13.zip.b64 > "$RUNNER_TEMP/bf-v0.13.zip"
          printf '%s  %s\n' 'b561435fdb3cd284b8d3d21562ffe31b49f6168221672dbf38fcff5f4deb2a9b' "$RUNNER_TEMP/bf-v0.13.zip" | sha256sum --check
          unzip -o -q "$RUNNER_TEMP/bf-v0.13.zip" -d black-frequency/project
      - name: Validate Russian titles for every anomaly
        working-directory: black-frequency/project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path('src/main/java/com/blackfrequency/hollowsignal/world/HorrorDirector.java').read_text()
          catalog = Path('src/main/java/com/blackfrequency/hollowsignal/client/AdminAnomalyCatalog.java').read_text()
          ids = set(re.findall(r'(?:d|major)\("([a-z_]+)"', src))
          labels = set(re.findall(r'^\s+([a-z_]+)\|', catalog, re.M))
          assert ids == labels, (ids-labels, labels-ids)
          print('PASS:', len(ids), 'anomalies have Russian labels')
          PY
      - name: Parse Java 17 and validate anomaly routing
        working-directory: black-frequency/project
        run: |
          python3 scripts/check_java_syntax.py
          python3 scripts/validate_anomalies.py
      - name: Build reobfuscated Forge jar
        working-directory: black-frequency/project
        run: gradle --no-daemon --stacktrace build
      - name: Publish JAR
        uses: actions/upload-artifact@v4
        with:
          name: BLACK-FREQUENCY-Forge-1.20.1-v0.13.0
          path: black-frequency/project/build/libs/hollowsignal-0.13.0.jar
          if-no-files-found: error
