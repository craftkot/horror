name: Build BLACK FREQUENCY Forge addon
on:
  workflow_dispatch:
  push:
    branches: [feature/world-sky-rift]
    paths:
      - 'addon/**'
      - '.github/workflows/build-forge-addon.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build addon
        working-directory: addon
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: blackfrequency-forge
          path: addon/build/libs/*.jar
