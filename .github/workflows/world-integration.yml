name: BLACK FREQUENCY World Integration
on:
  workflow_dispatch:
  push:
    branches: [feature/world-sky-rift]
    paths:
      - 'addon/**'
      - '.github/workflows/world-integration.yml'

jobs:
  world-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [fracture, restoration, deferred, sparse]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          # Trusted feature-branch pushes may seed the matrix jobs' Gradle caches.
          cache-read-only: false
      - name: Build addon
        working-directory: addon
        run: gradle --no-daemon build
      - name: Launch disposable Forge world with accelerated narrative
        working-directory: addon
        env:
          JAVA_TOOL_OPTIONS: "-Dblackfrequency.ciTestMode=true -Dblackfrequency.ciTickStep=2400 -Dblackfrequency.ciAllowEmptyServer=true -Xmx3G"
          BF_TEST_MODE: ${{ matrix.mode }}
        run: |
          if [ "$BF_TEST_MODE" = "restoration" ] || [ "$BF_TEST_MODE" = "deferred" ]; then
            export JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS -Dblackfrequency.ciExerciseRestoration=true"
          fi
          if [ "$BF_TEST_MODE" = "restoration" ]; then
            export JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS -Dblackfrequency.ciFlowingFluidTest=true -Dblackfrequency.ciRestoreWriteFailureTest=true"
          fi
          if [ "$BF_TEST_MODE" = "deferred" ]; then
            export JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS -Dblackfrequency.ciDeferredChunkTest=true"
          fi
          if [ "$BF_TEST_MODE" = "sparse" ]; then
            export JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS -Dblackfrequency.ciSparseRecoveryTest=true"
          fi
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nspawn-protection=0\nlevel-name=ci-disposable-world\n' > run/server.properties
          set +e
          timeout --signal=TERM --kill-after=10s 240s gradle --no-daemon runServer --args='--nogui' > world-test.log 2>&1
          CODE=$?
          set -e
          echo "Server process exit: $CODE"
          tail -n 100 world-test.log
          test "$CODE" -eq 124 -o "$CODE" -eq 0
          grep -q 'BLACK_FREQUENCY_TEST FINALE_STARTED' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST FRACTURE_PHASE_STARTED' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST FIRST_BLOCK_REMOVED' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST FRACTURE_SCAN_MODE_TAG_QUARANTINE_VERIFIED missingLegacyAccepted=true malformedSurfaceFirstQuarantined=true malformedCenterOutQuarantined=true restorationPreserved=true roundTrip=true' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST FRACTURE_SCAN_MODE_MISSING_COMPANION_QUARANTINE_VERIFIED missingCenterOut=true missingSurfaceFirst=true missingCenterOutIndex=true legacyIntermediatePreserved=true' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST CORRUPT_CENTER_OUT_CURSOR_TERMINAL_SENTINEL_VERIFIED isolated=true combinedMissingCompanion=true' world-test.log
          if [ "$BF_TEST_MODE" = "restoration" ] || [ "$BF_TEST_MODE" = "deferred" ]; then
            # This activation-guard suite runs when restoration starts; fracture/sparse modes have no player.
            grep -q 'BLACK_FREQUENCY_TEST BEACON_INTERACTION_GUARD_VERIFIED maxDistance=4.5 maxDistanceSquared=20.25 eyeToAabb=true strictBoundary=true remote64Rejected=true invalidRejected=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST BEACON_HIT_POINT_GUARD_PROFILE_VERIFIED exactBoundary=true outsideRejected=true invalidRejected=true rayMatch=true displacedRejected=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST ACTIVE_RECOVERY_BEACON_MENU_GUARD_VERIFIED sameBeaconSuppressed=true otherBeaconPreserved=true inactivePreserved=true completedPreserved=true missingPositionPreserved=true noPendingPreserved=true' world-test.log
            # Recovery-only diagnostics are emitted when this mode actually starts restoration.
            grep -q 'BLACK_FREQUENCY_TEST RECOVERY_SNAPSHOT_PAYLOAD_QUARANTINE_VERIFIED entries=2 retainedPayload=false' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RECOVERY_SNAPSHOT_RESOURCE_LOCATION_QUARANTINE_VERIFIED invalidRejected=true validNamespaced=true quarantined=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RECOVERY_SNAPSHOT_BLOCK_STATE_CANONICAL_ROUNDTRIP_VERIFIED valid=true invalidPropertyValue=true unknownProperty=true unknownBlock=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RECOVERY_SNAPSHOT_LIST_CORRUPTION_PARTIAL_STATUS_VERIFIED activeRecovery=true invalidContainers=2 restored=0 partialMessage=true persisted=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RECOVERY_SNAPSHOT_CORRUPTION_COUNTER_PERSISTENCE_VERIFIED previousWarning=true incremented=true dirty=true roundTrip=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST CORRUPT_STATE_COUNTERS_PERSISTED negative=true excessive=true wrongType=true legacyMissingAllowed=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RECOVERY_SNAPSHOT_RETENTION_BUDGET_VERIFIED' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RECOVERY_SNAPSHOT_ENTRY_SIZE_BOUND_VERIFIED' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RECOVERY_SNAPSHOT_RUNTIME_BUDGET_GUARD_VERIFIED' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RECOVERY_BEACON_VISUAL_ANCHOR_BOUNDS_VERIFIED radius=128 minYInclusive=true maxYExclusive=true worldBorder=true invalidRejected=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RECOVERY_BEACON_POSITION_PRESENCE_VERIFIED missingOrWrongTypeRejected=true originCoordinatePreserved=true fallback=rift-anchor' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RECOVERY_BEACON_POSITION_TYPE_QUARANTINE_VERIFIED malformedType=true dirty=true removedOnSave=true roundTrip=true fallbackPreserved=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST NATURAL_BEACON_UUID_POSITION_PAIR_VERIFIED orphanRejected=true zeroPositionPreserved=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RESTORE_CURSOR_REPAIR_PERSISTENCE_VERIFIED indexClamped=true scanClamped=true dirty=true roundTrip=true validUnchanged=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RECOVERY_DUPLICATE_SNAPSHOT_POSITION_QUARANTINE_VERIFIED entries=2 retained=1 quarantined=1 oldestWins=true cursorPreserved=true budgetSafe=true roundTrip=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST COMPLETED_RECOVERY_STALE_SNAPSHOT_QUARANTINE_VERIFIED conflictingFlags=true staleSnapshots=true malformedContainer=true terminalPreserved=true dirty=true roundTrip=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RECOVERY_INVALID_SNAPSHOT_WARNING_RATE_LIMIT_VERIFIED attempts=1000 warnings=1 persisted=true legacyDefault=false' world-test.log
            grep -Eq 'BLACK_FREQUENCY_TEST RECOVERY_INVALID_SNAPSHOT_SUMMARY_EMITTED count=[1-9][0-9]* singleSummary=true' world-test.log
            test "$(grep -c 'BLACK_FREQUENCY_TEST RECOVERY_INVALID_SNAPSHOT_SUMMARY_EMITTED' world-test.log)" -eq 1
          fi
          # Compact violet Dust flecks replace oversized block-textured chips at the four outer tips.
          grep -q 'BLACK_FREQUENCY_TEST SURFACE_FISSURE_EDGE_DUST_LAYOUT_VERIFIED count=4 color=violet perArm=1 outerTip=true' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST SURFACE_FISSURE_OUTER_TIP_FALLBACK_VERIFIED policy=furthest-valid-sample' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST SURFACE_FISSURE_EDGE_DUST_VERIFIED red=0.42 green=0.18 blue=0.92 scale=0.7' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST SURFACE_FISSURE_EDGE_DUST_PULSE_PROFILE_VERIFIED min=0.64 base=0.7 max=0.74 variants=3 bounded=true phaseDriven=true cached=true' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST SURFACE_FISSURE_EDGE_DUST_CACHE_VERIFIED cached=true scale=0.7' world-test.log
          # Actual particle delivery requires a player; the headless server has none.
          # Client Smoke asserts SURFACE_FISSURE_EDGE_DUST_EMITTED against a real client.
          grep -q 'BLACK_FREQUENCY_TEST SURFACE_FISSURE_PARTICLE_BUDGET_VERIFIED total=52 accentDust=8 violetDust=40 edgeDust=4' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST SURFACE_FISSURE_SAMPLE_CACHE_VERIFIED samples=48 geometryBitExact=true pulseBitExact=true geometryTrigPerEmission=0 dynamicPulseSin=48 radius=48' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST SURFACE_FISSURE_BEND_PROFILE_VERIFIED amplitude=0.24 maxOffset=0.24 shared=true' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST SURFACE_FISSURE_ACCENT_DUST_VERIFIED red=0.3 green=0.14 blue=0.88 scale=0.85' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST SURFACE_FISSURE_VIOLET_DUST_VERIFIED red=0.34 green=0.08 blue=0.78 scale=0.85' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST SURFACE_FISSURE_DUST_PULSE_PROFILE_VERIFIED min=0.65 low=0.75 base=0.85 high=0.95 max=1.05 variants=5' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST PLAYER_VISIBLE_FISSURE_TARGET_SELECTION_VERIFIED policy=balanced-view targetPitch=45 ties=stable invalidRejected=true minHorizontal=2.25 maxHorizontal=12.0' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST PLAYER_VISIBLE_FISSURE_BEACON_STANDOFF_PROFILE_VERIFIED maxHorizontal=12.0 beaconPadNear=6.5 beaconPadFar=11.75 boundaryRejected=true' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST PLAYER_BEACON_SAFE_PAD_PROFILE_VERIFIED floorOffset=0 playerOffset=1 lateralRadius=0 axisPolicy=perpendicular firstSolidRow=3 gapRow=2 lastSolidRow=3 standoff=3.0 distanceSquared=9.25 padInnerFaceY=2.2666666666666666 beaconEntryY=0.8533333333333333 withinReach=true beamColumnUntouched=true perpendicular=true' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST BEACON_BREAK_REACH_AABB_VERIFIED boundary=20.25 axes=3 negativeCoordinates=true outsideRejected=true invalidRejected=true' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST NATURAL_BEACON_BREAK_REACH_GUARD_VERIFIED exactBoundary=true outsideRejected=true invalidRejected=true eventGuard=true' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST BEACON_BREAK_BUILD_PERMISSION_GUARD_VERIFIED survival=true creative=true adventureRejected=true spectatorRejected=true deadRejected=true removedRejected=true' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST BEACON_RAY_CHUNK_TRAVERSAL_VERIFIED skippedAabbOnlyChunk=true traversedChunkRequired=true negativeDirection=true cornerTouchGuard=true invalidRejected=true' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST SURFACE_FISSURE_STRUCTURAL_SUPPORT_FILTER_VERIFIED' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST SURFACE_FISSURE_BLOCK_ENTITY_FILTER_VERIFIED support=true surface=true' world-test.log
          if [ "$BF_TEST_MODE" = "fracture" ] || [ "$BF_TEST_MODE" = "sparse" ]; then
            # The loaded-world canopy fixture runs during active fracture scanning, not restoration ticks.
            grep -q 'BLACK_FREQUENCY_TEST SURFACE_FISSURE_CANOPY_TRAVERSAL_VERIFIED verticalLogs=true leaves=true horizontalLogsRejected=true roofBlocksRejected=true nonSolidPlantsRetained=true heightmapIncludesLeaves=true depthBound=32' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST SURFACE_FISSURE_WORLD_CANOPY_SAMPLE_VERIFIED heightmapTopOffset=5 canopyBlocks=4 surfaceFound=true horizontalLogRejected=true roofRejected=true loadedOnly=true searchRadius=8 restored=true rejectedResultCleared=true unloadedChunkRejected=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST SURFACE_FISSURE_CANOPY_FIXTURE_CELL_POLICY_VERIFIED air=true leaves=true nonSolidPlants=true fluids=false blockEntities=false solids=false' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST SURFACE_FISSURE_CANOPY_FIXTURE_RESTORATION_VERIFIED originalHeightRestored=true loadedOnly=true radius=8' world-test.log
          fi
          python3 - <<'PY'
          import pathlib,re
          log=pathlib.Path('world-test.log').read_text(errors='replace')
          match=re.search(r'BLACK_FREQUENCY_TEST FIRST_BLOCK_REMOVED x=(-?\d+) y=(-?\d+) z=(-?\d+) surfaceY=(-?\d+) scanOrder=([a-z-]+)',log)
          assert match, 'First fracture did not report its surface-first scan position'
          x,y,z,surface_y,order=match.groups()
          assert order=='surface-first-center-out', f'New-world fracture must start at the anchor: {order}'
          assert int(surface_y)-4 <= int(y) < int(surface_y), f'First edit was not near surface: {y=} {surface_y=}'
          print(f'SURFACE_FIRST_FRACTURE_VERIFIED x={x} y={y} z={z} surfaceY={surface_y}')
          PY
          if [ "$BF_TEST_MODE" = "sparse" ]; then
            # The headless server has no player to place a beacon beside. Assert
            # that a finished fracture with fewer than 160 edits reaches the
            # real placement path; client tests cover physical placement/PKM.
            python3 - <<'PY'
          import pathlib,re
          log=pathlib.Path('world-test.log').read_text(errors='replace')
          match=re.search(r'BLACK_FREQUENCY_TEST SPARSE_RECOVERY_ELIGIBLE edits=(\d+) pending=(\d+)',log)
          assert match, 'Sparse fracture never reached the beacon placement path'
          edits,pending=map(int,match.groups())
          assert 0<edits<160 and pending>0, f'Not a sparse damaged world: {edits=} {pending=}'
          print(f'SPARSE_RECOVERY_ELIGIBILITY_VERIFIED edits={edits} pending={pending}')
          PY
          fi
          if [ "$BF_TEST_MODE" = "deferred" ]; then
            grep -q "BLACK_FREQUENCY_TEST INVALID_UNLOADED_SNAPSHOT_INJECTED" world-test.log
            # The injected position is 4096 blocks away, outside the bounded
            # fracture. Since the bounds guard now runs before chunk checks,
            # it must be quarantined rather than deferred forever.
            grep -q "BLACK_FREQUENCY_TEST OUT_OF_BOUNDS_SNAPSHOT_SKIPPED" world-test.log
            grep -q "BLACK_FREQUENCY_TEST BEACON_RESTORATION_FINISHED" world-test.log
            python3 - <<'PY'
          import pathlib,re
          log=pathlib.Path("world-test.log").read_text(errors="replace")
          injected=re.search(r"BLACK_FREQUENCY_TEST INVALID_UNLOADED_SNAPSHOT_INJECTED x=(-?\d+) z=(-?\d+)",log)
          skipped=re.search(r"BLACK_FREQUENCY_TEST OUT_OF_BOUNDS_SNAPSHOT_SKIPPED x=(-?\d+) y=(-?\d+) z=(-?\d+)",log)
          finished=re.search(r"BLACK_FREQUENCY_TEST BEACON_RESTORATION_FINISHED restored=(\d+) destroyed=(\d+) skippedOccupied=(\d+) skippedInvalid=(\d+)",log)
          assert injected and skipped and finished, "Missing corrupt-unloaded-snapshot markers"
          assert (int(injected[1]),int(injected[2]))==(int(skipped[1]),int(skipped[3])), "Wrong snapshot quarantined"
          restored,destroyed,occupied,invalid=map(int,finished.groups())
          assert invalid==1, f"Expected exactly one quarantined invalid snapshot: {invalid=}"
          assert restored+occupied+invalid==destroyed, (
              f"Unaccounted recovery snapshots: {restored=} {occupied=} {invalid=} {destroyed=}"
          )
          assert "BLACK_FREQUENCY_TEST DEFERRED_CHUNK_SKIPPED" not in log, "Out-of-bounds snapshot was deferred"
          print(f"INVALID_UNLOADED_SNAPSHOT_QUARANTINED restored={restored} occupied={occupied} invalid={invalid} destroyed={destroyed}")
          PY
          fi
          if [ "$BF_TEST_MODE" = "restoration" ]; then
            grep -q 'BLACK_FREQUENCY_TEST BEACON_RESTORATION_STARTED' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST BEACON_RESTORATION_FINISHED' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST FLOWING_FLUID_INJECTED' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST FLOWING_FLUID_REPLACED' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RESTORE_WRITE_DEFERRED' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RESTORE_WRITE_RETRIED' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST IDLE_BEACON_PARTICLE_CADENCE_VERIFIED intervalTicks=20 particles=6 cachedDust=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST IDLE_BEACON_PARTICLE_HALO_PROFILE_VERIFIED spreadXZ=0.34 spreadY=0.08 speed=0.006 flattened=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST IDLE_BEACON_PARTICLE_AUDIENCE_BOUNDS_VERIFIED maxDistance=32.0 maxDistanceSquared=1024.0 strictBoundary=true invalidRejected=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST SURFACE_FRACTURE_PARTICLE_AUDIENCE_BOUNDS_VERIFIED maxDistance=32.0 maxDistanceSquared=1024.0 strictBoundary=true invalidRejected=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RESTORATION_PARTICLE_PROFILE_VERIFIED ring=24 ringIntervalTicks=20 sparks=4 helix=16 helixIntervalTicks=8 blockCue=6 blockIntervalBlocks=48 audience=8 audienceIntervalTicks=20 cachedDust=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RESTORATION_COMPLETION_ACTIONBAR_ONLY_VERIFIED success=true partial=true titlePackets=false' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RESTORATION_RING_CLEARANCE_VERIFIED' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RESTORE_INITIAL_PULSE_POLICY_VERIFIED tick=1 ringParticles=24 sparks=4 scanOnStart=true loadedOnly=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RESTORE_PLAYER_SCAN_PROFILE_VERIFIED intervalTicks=4 menuClose=shared viewerScan=shared loadedOnly=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RESTORE_PARTICLE_AUDIENCE_BOUNDS_VERIFIED maxDistance=37.0 maxDistanceSquared=1369.0 packetRange=32.0 effectEnvelope=5.0 strictBoundary=true invalidRejected=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RESTORE_PLAYER_SCAN_REUSE_VERIFIED sameInstance=true staleStateCleared=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RESTORE_POSITION_CURSOR_REUSE_VERIFIED sameInstance=true packedCoordinates=true transient=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RESTORE_PLAYER_SCAN_FULL_PASS_VERIFIED fixturePlayers=2 menusAfterViewer=1 fullPass=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST GRAVITY_ANOMALY_PARTICLE_PALETTE_VERIFIED base=deep-violet accent=bright-violet cached=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST IDLE_BEACON_VIOLET_PALETTE_VERIFIED red=0.48 green=0.14 blue=0.98 scale=0.9 count=6 intervalTicks=20 cached=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST ANOMALY_FIELD_TURBULENCE_VERIFIED baseWeight=1.0 crossAmplitude=0.12 bounded=true deterministic=true liftPocket=true sinkPocket=true timeDrift=true invalidRejected=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST ANOMALY_CROSS_SHEAR_PROFILE_VERIFIED threshold=0.42 max=0.00464 maxCombinedDrift=0.03964 monotonic=true bounded=true deterministic=true invalidRejected=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST ANOMALY_FIELD_MULTI_SCALE_VERIFIED turbulenceAmplitude=0.06 samples=100 deterministic=true bounded=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST ANOMALY_FIELD_PHASE_WARP_VERIFIED amplitude=0.55 source=crossWave extraTrigPerPlayer=0 nonlinearCoupling=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST ANOMALY_FIELD_RADIAL_FALLOFF_VERIFIED innerRadius=48.0 outerRadius=64.0 width=16.0 curve=smoothstep midpoint=0.5 monotonic=true invalidNeutral=true particleThreshold=0.04296875' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST ANOMALY_FIELD_TIME_PHASE_CACHE_VERIFIED cachedOffsets=8 sameTickReuse=true tickRewind=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RECOVERY_UI_PALETTE_VERIFIED rgb=5714c7 legacyFormatting=false' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RESTORATION_GRAVITY_FADE_PROFILE_VERIFIED ticks=40 start=1.0 midpoint=0.5 end=0.0 monotonic=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RESTORATION_GRAVITY_FADE_SAVE_ROUNDTRIP_VERIFIED elapsed=20 scale=0.5' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RESTORATION_GRAVITY_FADE_RUNTIME_STARTED ticks=40' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RESTORE_UI_AUDIENCE_CADENCE_VERIFIED progressIntervalTicks=40 overlayIntervalTicks=10 combinedBoundary=true' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RESTORE_UI_AUDIENCE_SHARED_PASS progress=true overlay=true .*singleTraversal=true' world-test.log
            echo 'RESTORE_WRITE_RETRY_VERIFIED: a rejected block write was retained and retried on a later tick'
            echo 'FLOWING_FLUID_RESTORATION_VERIFIED'
            python3 - <<'PY'
          import pathlib,re
          log=pathlib.Path("world-test.log").read_text(errors="replace")
          match=re.search(r"BLACK_FREQUENCY_TEST BEACON_RESTORATION_FINISHED restored=(\d+) destroyed=(\d+)",log)
          assert match, "Missing restored/destroyed block counters"
          restored,destroyed=map(int,match.groups())
          assert destroyed>=160, f"Too little damage exercised: {destroyed}"
          assert restored==destroyed, f"Restoration incomplete: {restored}/{destroyed}"
          failed=re.search(r"BLACK_FREQUENCY_TEST RESTORE_WRITE_DEFERRED [^\n]* tick=(\d+)",log)
          retried=re.search(r"BLACK_FREQUENCY_TEST RESTORE_WRITE_RETRIED [^\n]* tick=(\d+)",log)
          assert failed and retried, "Missing write-failure and retry markers"
          assert int(retried.group(1))>int(failed.group(1)), "Rejected write was retried in the same tick"
          print(f"RESTORE_WRITE_NEXT_TICK_VERIFIED {failed.group(1)} -> {retried.group(1)}")
          print(f"BEACON_RESTORATION_VERIFIED {restored}/{destroyed}")
          PY
          echo 'Restarting disposable server to verify restoration persists'
          set +e
          timeout --signal=TERM --kill-after=10s 110s gradle --no-daemon runServer --args='--nogui' > world-restart.log 2>&1
          RESTART_CODE=$?
          set -e
          test "$RESTART_CODE" -eq 124 -o "$RESTART_CODE" -eq 0
          grep -Eq 'BLACK_FREQUENCY_TEST STATE_LOADED .*restored=true .*restoring=false .*snapshots=0' world-restart.log
          # The finale must not resume gravity anomalies after a completed
          # restoration, including after loading the saved world again.
          python3 - <<'PY'
          import pathlib, re
          pattern=r"BLACK_FREQUENCY_TEST RESTORED_GRAVITY_DISABLED finaleTicks=(\d+)"
          before=pathlib.Path("world-test.log").read_text(errors="replace")
          after=pathlib.Path("world-restart.log").read_text(errors="replace")
          first=re.search(pattern,before)
          second=re.search(pattern,after)
          assert first and second, "Restored-world gravity guard not executed"
          assert first.group(1)==second.group(1), "Finale clock advanced after restoration or restart"
          print(f"RESTORED_GRAVITY_DISABLED_VERIFIED finaleTicks={first.group(1)}")
          PY
          echo 'BEACON_RESTORATION_RESTART_VERIFIED'
          fi
      - name: Upload logs and crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackfrequency-world-integration-${{ matrix.mode }}
          if-no-files-found: ignore
          path: |
            addon/world-test.log
            addon/world-restart.log
            addon/run/logs/**
            addon/run/crash-reports/**
