name: BLACK FREQUENCY World Integration
on:
  workflow_dispatch:
  push:
    branches: [feature/world-sky-rift]
    paths:
      - 'addon/**'
      - '.github/workflows/world-integration.yml'

jobs:
  world-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [fracture, restoration, deferred, sparse]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build addon
        working-directory: addon
        run: gradle --no-daemon build
      - name: Launch disposable Forge world with accelerated narrative
        working-directory: addon
        env:
          JAVA_TOOL_OPTIONS: "-Dblackfrequency.ciTestMode=true -Dblackfrequency.ciTickStep=2400 -Dblackfrequency.ciAllowEmptyServer=true -Xmx3G"
          BF_TEST_MODE: ${{ matrix.mode }}
        run: |
          if [ "$BF_TEST_MODE" = "restoration" ] || [ "$BF_TEST_MODE" = "deferred" ]; then
            export JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS -Dblackfrequency.ciExerciseRestoration=true"
          fi
          if [ "$BF_TEST_MODE" = "restoration" ]; then
            export JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS -Dblackfrequency.ciFlowingFluidTest=true -Dblackfrequency.ciRestoreWriteFailureTest=true"
          fi
          if [ "$BF_TEST_MODE" = "deferred" ]; then
            export JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS -Dblackfrequency.ciDeferredChunkTest=true"
          fi
          if [ "$BF_TEST_MODE" = "sparse" ]; then
            export JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS -Dblackfrequency.ciSparseRecoveryTest=true"
          fi
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nspawn-protection=0\nlevel-name=ci-disposable-world\n' > run/server.properties
          set +e
          timeout --signal=TERM --kill-after=10s 240s gradle --no-daemon runServer --args='--nogui' > world-test.log 2>&1
          CODE=$?
          set -e
          echo "Server process exit: $CODE"
          tail -n 100 world-test.log
          test "$CODE" -eq 124 -o "$CODE" -eq 0
          grep -q 'BLACK_FREQUENCY_TEST FINALE_STARTED' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST FRACTURE_PHASE_STARTED' world-test.log
          grep -q 'BLACK_FREQUENCY_TEST FIRST_BLOCK_REMOVED' world-test.log
          if [ "$BF_TEST_MODE" = "sparse" ]; then
            # The headless server has no player to place a beacon beside. Assert
            # that a finished fracture with fewer than 160 edits reaches the
            # real placement path; client tests cover physical placement/PKM.
            python3 - <<'PY'
          import pathlib,re
          log=pathlib.Path('world-test.log').read_text(errors='replace')
          match=re.search(r'BLACK_FREQUENCY_TEST SPARSE_RECOVERY_ELIGIBLE edits=(\d+) pending=(\d+)',log)
          assert match, 'Sparse fracture never reached the beacon placement path'
          edits,pending=map(int,match.groups())
          assert 0<edits<160 and pending>0, f'Not a sparse damaged world: {edits=} {pending=}'
          print(f'SPARSE_RECOVERY_ELIGIBILITY_VERIFIED edits={edits} pending={pending}')
          PY
          fi
          if [ "$BF_TEST_MODE" = "deferred" ]; then
            grep -q "BLACK_FREQUENCY_TEST INVALID_UNLOADED_SNAPSHOT_INJECTED" world-test.log
            # The injected position is 4096 blocks away, outside the bounded
            # fracture. Since the bounds guard now runs before chunk checks,
            # it must be quarantined rather than deferred forever.
            grep -q "BLACK_FREQUENCY_TEST OUT_OF_BOUNDS_SNAPSHOT_SKIPPED" world-test.log
            grep -q "BLACK_FREQUENCY_TEST BEACON_RESTORATION_FINISHED" world-test.log
            python3 - <<'PY'
          import pathlib,re
          log=pathlib.Path("world-test.log").read_text(errors="replace")
          injected=re.search(r"BLACK_FREQUENCY_TEST INVALID_UNLOADED_SNAPSHOT_INJECTED x=(-?\\d+) z=(-?\\d+)",log)
          skipped=re.search(r"BLACK_FREQUENCY_TEST OUT_OF_BOUNDS_SNAPSHOT_SKIPPED x=(-?\\d+) y=(-?\\d+) z=(-?\\d+)",log)
          finished=re.search(r"BLACK_FREQUENCY_TEST BEACON_RESTORATION_FINISHED restored=(\\d+) destroyed=(\\d+)",log)
          assert injected and skipped and finished, "Missing corrupt-unloaded-snapshot markers"
          assert (int(injected[1]),int(injected[2]))==(int(skipped[1]),int(skipped[3])), "Wrong snapshot quarantined"
          restored,destroyed=map(int,finished.groups())
          assert restored==destroyed-1, f"Expected one quarantined snapshot: {restored=}, {destroyed=}"
          assert "BLACK_FREQUENCY_TEST DEFERRED_CHUNK_SKIPPED" not in log, "Out-of-bounds snapshot was deferred"
          print(f"INVALID_UNLOADED_SNAPSHOT_QUARANTINED restored={restored} destroyed={destroyed}")
          PY
          fi
          if [ "$BF_TEST_MODE" = "restoration" ]; then
            grep -q 'BLACK_FREQUENCY_TEST BEACON_RESTORATION_STARTED' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST BEACON_RESTORATION_FINISHED' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST FLOWING_FLUID_INJECTED' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST FLOWING_FLUID_REPLACED' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RESTORE_WRITE_DEFERRED' world-test.log
            grep -q 'BLACK_FREQUENCY_TEST RESTORE_WRITE_RETRIED' world-test.log
            echo 'RESTORE_WRITE_RETRY_VERIFIED: a rejected block write was retained and retried on a later tick'
            echo 'FLOWING_FLUID_RESTORATION_VERIFIED'
            python3 - <<'PY'
          import pathlib,re
          log=pathlib.Path("world-test.log").read_text(errors="replace")
          match=re.search(r"BLACK_FREQUENCY_TEST BEACON_RESTORATION_FINISHED restored=(\d+) destroyed=(\d+)",log)
          assert match, "Missing restored/destroyed block counters"
          restored,destroyed=map(int,match.groups())
          assert destroyed>=160, f"Too little damage exercised: {destroyed}"
          assert restored==destroyed, f"Restoration incomplete: {restored}/{destroyed}"
          failed=re.search(r"BLACK_FREQUENCY_TEST RESTORE_WRITE_DEFERRED [^\n]* tick=(\d+)",log)
          retried=re.search(r"BLACK_FREQUENCY_TEST RESTORE_WRITE_RETRIED [^\n]* tick=(\d+)",log)
          assert failed and retried, "Missing write-failure and retry markers"
          assert int(retried.group(1))>int(failed.group(1)), "Rejected write was retried in the same tick"
          print(f"RESTORE_WRITE_NEXT_TICK_VERIFIED {failed.group(1)} -> {retried.group(1)}")
          print(f"BEACON_RESTORATION_VERIFIED {restored}/{destroyed}")
          PY
          echo 'Restarting disposable server to verify restoration persists'
          set +e
          timeout --signal=TERM --kill-after=10s 110s gradle --no-daemon runServer --args='--nogui' > world-restart.log 2>&1
          RESTART_CODE=$?
          set -e
          test "$RESTART_CODE" -eq 124 -o "$RESTART_CODE" -eq 0
          grep -Eq 'BLACK_FREQUENCY_TEST STATE_LOADED .*restored=true .*restoring=false .*snapshots=0' world-restart.log
          # The finale must not resume gravity anomalies after a completed
          # restoration, including after loading the saved world again.
          python3 - <<'PY'
          import pathlib, re
          pattern=r"BLACK_FREQUENCY_TEST RESTORED_GRAVITY_DISABLED finaleTicks=(\d+)"
          before=pathlib.Path("world-test.log").read_text(errors="replace")
          after=pathlib.Path("world-restart.log").read_text(errors="replace")
          first=re.search(pattern,before)
          second=re.search(pattern,after)
          assert first and second, "Restored-world gravity guard not executed"
          assert first.group(1)==second.group(1), "Finale clock advanced after restoration or restart"
          print(f"RESTORED_GRAVITY_DISABLED_VERIFIED finaleTicks={first.group(1)}")
          PY
          echo 'BEACON_RESTORATION_RESTART_VERIFIED'
          fi
      - name: Upload logs and crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackfrequency-world-integration-${{ matrix.mode }}
          if-no-files-found: ignore
          path: |
            addon/world-test.log
            addon/world-restart.log
            addon/run/logs/**
            addon/run/crash-reports/**
