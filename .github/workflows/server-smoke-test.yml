name: Forge Server Smoke Test

on:
  push:
    branches: [ main ]
    paths:
      - "manifest.json"
      - "ci/**"
      - ".github/workflows/server-smoke-test.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Forge server
        run: |
          mkdir -p server/mods
          curl --fail --location --retry 3 \
            -o forge-installer.jar \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.15/forge-1.20.1-47.4.15-installer.jar
          cd server
          java -jar ../forge-installer.jar --installServer

      - name: Download server-safe mod set
        run: python ci/download_server_mods.py

      - name: Run Forge smoke test
        run: python ci/run_server_smoke.py

      - name: Upload Forge logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-server-smoke-logs
          if-no-files-found: ignore
          path: |
            server/logs/**
            server/crash-reports/**
            server/debug.log
