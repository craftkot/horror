name: Unwritten Minecraft build
on:
  push:
    branches: [the-unwritten-26.3]
    paths: ['unwritten/**', '.github/workflows/unwritten-build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: gradle -p unwritten build --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: the-unwritten-alpha
          path: unwritten/build/libs/*.jar
          if-no-files-found: error
